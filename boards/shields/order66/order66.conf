CONFIG_ZMK_POINTING=y
CONFIG_ZMK_WPM=n
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=86400000

# use our own vendored copy of nice_view's widgets (see widgets/) instead of
# nice_view's own, so the rotation angle is configurable (see Kconfig.defconfig)
# without patching ZMK/nice_view itself.
CONFIG_NICE_VIEW_WIDGET_STATUS=n
